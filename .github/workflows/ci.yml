name: Android CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run tests, lint, and assemble the Android app
        run: >-
          ./gradlew --no-daemon
          :core:model:testAndroidHostTest
          :core:domain:testAndroidHostTest
          :core:data:testAndroidHostTest
          :feature:control:testDebugUnitTest
          :app:lintDebug
          :feature:control:lintDebug
          :feature:devices:lintDebug
          :app:assembleDebug
