workflows:
  ios-simulator:
    name: WordClock - iOS Simulator
    max_build_duration: 120
    instance_type: mac_mini_m2

    environment:
      xcode: latest

    cache:
      cache_paths:
        - $HOME/.gradle/caches
        - $HOME/.gradle/wrapper
        - $HOME/.konan

    scripts:
      - name: Configure Gradle and Android SDK path
        script: |
          set -e
          cd "$CM_BUILD_DIR"
          chmod +x ./gradlew
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/share/android-sdk}}"
          if [ ! -d "$SDK_ROOT" ]; then
            echo "ERROR: Android SDK directory does not exist: $SDK_ROOT"
            exit 1
          fi
          echo "sdk.dir=$SDK_ROOT" > local.properties

      - name: Print build tool versions
        script: |
          set -e
          cd "$CM_BUILD_DIR"
          xcodebuild -version
          java -version
          ./gradlew --version

      - name: Validate Xcode project and capture diagnostics
        script: |
          set -e
          set -o pipefail
          DIAG_DIR="$CM_BUILD_DIR/build/xcode-diagnostics"
          mkdir -p "$DIAG_DIR"
          xcodebuild -version 2>&1 | tee "$DIAG_DIR/xcode-version.log"
          plutil -lint "$CM_BUILD_DIR/iosApp/WordClock.xcodeproj/project.pbxproj" 2>&1 | tee "$DIAG_DIR/project-lint.log"

          set +e
          xcodebuild -showBuildSettings \
            -project "$CM_BUILD_DIR/iosApp/WordClock.xcodeproj" \
            -target WordClockIOS \
            -sdk iphonesimulator \
            -configuration Debug \
            SYMROOT="$CM_BUILD_DIR/build/ios-simulator/Build/Products" \
            OBJROOT="$CM_BUILD_DIR/build/ios-simulator/Build/Intermediates.noindex" \
            > "$DIAG_DIR/xcode-build-settings.log" 2>&1
          STATUS=$?
          set -e
          echo "xcodebuild -showBuildSettings exit code: $STATUS" \
            | tee "$DIAG_DIR/xcode-build-settings-status.txt"
          if [ "$STATUS" -ne 0 ]; then
            sleep 10
            find "$HOME/Library/Logs/DiagnosticReports" -maxdepth 3 -type f -mmin -90 \
              \( -iname '*xcodebuild*' -o -iname '*xcbuild*' \) \
              -exec cp -p {} "$DIAG_DIR/" \; 2>/dev/null || true
            find "$HOME/Library/Logs/DiagnosticReports" -maxdepth 3 -type f -mmin -90 -print \
              > "$DIAG_DIR/recent-diagnostic-reports.txt" 2>&1 || true
          fi

          set +e
          xcodebuild -list -project "$CM_BUILD_DIR/iosApp/WordClock.xcodeproj" 2>&1 | tee "$DIAG_DIR/project-list.log"
          STATUS=$?
          set -e
          if [ "$STATUS" -ne 0 ]; then
            find "$HOME/Library/Logs/DiagnosticReports" -maxdepth 2 -type f -mmin -60 \
              \( -iname '*xcodebuild*.ips' -o -iname '*xcodebuild*.crash' -o -iname 'Xcode*.ips' -o -iname 'Xcode*.crash' \) \
              -exec cp -p {} "$DIAG_DIR/" \; 2>/dev/null || true
          fi
          exit "$STATUS"

      - name: Build Kotlin/Native Simulator framework
        script: |
          set -e
          set -o pipefail
          cd "$CM_BUILD_DIR"
          mkdir -p "$CM_BUILD_DIR/build"
          ./gradlew :shared:linkDebugFrameworkIosSimulatorArm64 --stacktrace --info \
            2>&1 | tee "$CM_BUILD_DIR/build/kotlin-ios-simulator-framework.log"

      - name: Build iOS Simulator app
        script: |
          set -e
          set -o pipefail
          mkdir -p "$CM_BUILD_DIR/build"
          if WORDCLOCK_SKIP_GRADLE_FRAMEWORK_BUILD=1 xcodebuild build \
              -project "$CM_BUILD_DIR/iosApp/WordClock.xcodeproj" \
              -target WordClockIOS \
              -sdk iphonesimulator \
              -configuration Debug \
              SYMROOT="$CM_BUILD_DIR/build/ios-simulator/Build/Products" \
              OBJROOT="$CM_BUILD_DIR/build/ios-simulator/Build/Intermediates.noindex" \
              ARCHS=arm64 \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              2>&1 | tee "$CM_BUILD_DIR/build/ios-simulator-build.log"; then
            STATUS=0
          else
            STATUS=$?
            echo "xcodebuild exited with status $STATUS" \
              | tee -a "$CM_BUILD_DIR/build/ios-simulator-build.log"
            sleep 10
            find "$HOME/Library/Logs/DiagnosticReports" -maxdepth 3 -type f -mmin -90 \
              \( -iname '*xcodebuild*' -o -iname '*xcbuild*' \) \
              -exec cp -p {} "$CM_BUILD_DIR/build/xcode-diagnostics/" \; 2>/dev/null || true
            find "$HOME/Library/Logs/DiagnosticReports" -maxdepth 3 -type f -mmin -90 -print \
              > "$CM_BUILD_DIR/build/xcode-diagnostics/recent-diagnostic-reports.txt" 2>&1 || true
          fi
          exit "$STATUS"

      - name: Install and launch on an iPhone Simulator
        script: |
          set -e
          cd "$CM_BUILD_DIR"
          APP_PATH="$CM_BUILD_DIR/build/ios-simulator/Build/Products/Debug-iphonesimulator/WordClockIOS.app"
          LOG_DIR="$CM_BUILD_DIR/build/simulator-diagnostics"
          mkdir -p "$LOG_DIR"
          if [ ! -d "$APP_PATH" ]; then
            echo "ERROR: Simulator app not found at $APP_PATH"
            exit 1
          fi
          DEVICE_ID="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next((x["udid"] for v in d["devices"].values() for x in v if x.get("isAvailable") and x.get("name", "").startswith("iPhone")), ""))')"
          if [ -z "$DEVICE_ID" ]; then
            echo "ERROR: No available iPhone Simulator found"
            exit 1
          fi

          echo "Selected simulator: $DEVICE_ID"
          echo "$DEVICE_ID" > "$LOG_DIR/simulator-id.txt"

          xcrun simctl boot "$DEVICE_ID" 2>/dev/null || true
          xcrun simctl bootstatus "$DEVICE_ID" -b

          BUNDLE_ID="$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$APP_PATH/Info.plist")"
          echo "Bundle identifier: $BUNDLE_ID"
          echo "$BUNDLE_ID" > "$LOG_DIR/bundle-id.txt"

          xcrun simctl install "$DEVICE_ID" "$APP_PATH" \
            > "$LOG_DIR/install.log" 2>&1

          xcrun simctl spawn "$DEVICE_ID" log stream \
            --style compact \
            --level debug \
            > "$LOG_DIR/simulator-system.log" 2>&1 &
          LOG_PID=$!

          xcrun simctl launch \
            --console \
            --terminate-running-process \
            "$DEVICE_ID" \
            "$BUNDLE_ID" \
            > "$LOG_DIR/app-console.log" 2>&1 &
          APP_PID=$!

          echo "Waiting 30 seconds for startup and crash logs..."
          sleep 30

          if kill -0 "$APP_PID" 2>/dev/null; then
            echo "simctl launch was still running after 30 seconds." \
              > "$LOG_DIR/launch-status.txt"
          else
            echo "simctl launch exited during the first 30 seconds." \
              > "$LOG_DIR/launch-status.txt"
          fi

          kill "$APP_PID" 2>/dev/null || true
          kill "$LOG_PID" 2>/dev/null || true
          wait "$APP_PID" 2>/dev/null || true
          wait "$LOG_PID" 2>/dev/null || true

          mkdir -p "$LOG_DIR/crash-reports"
          if [ -d "$HOME/Library/Logs/DiagnosticReports" ]; then
            find "$HOME/Library/Logs/DiagnosticReports" \
              -type f \
              -iname '*WordClockIOS*' \
              -exec cp {} "$LOG_DIR/crash-reports/" \;
          fi

          xcrun simctl list devices available \
            > "$LOG_DIR/available-simulators.txt"

          ditto -c -k --sequesterRsrc --keepParent \
            "$APP_PATH" "$CM_BUILD_DIR/build/WordClock-iOS-Simulator.zip"

    artifacts:
      - build/ios-simulator/Build/Products/Debug-iphonesimulator/WordClockIOS.app
      - build/simulator-diagnostics/**
      - build/xcode-diagnostics/**
      - build/WordClock-iOS-Simulator.zip
      - build/ios-simulator-build.log
      - build/kotlin-ios-simulator-framework.log

  ios-unsigned-ipa:
    name: WordClock - Unsigned iOS IPA
    max_build_duration: 120
    instance_type: mac_mini_m2

    environment:
      xcode: 26.4

    cache:
      cache_paths:
        - $HOME/.gradle/caches
        - $HOME/.gradle/wrapper
        - $HOME/.konan

    scripts:
      - name: Configure Gradle and Android SDK path
        script: |
          set -e
          cd "$CM_BUILD_DIR"
          chmod +x ./gradlew
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/share/android-sdk}}"
          if [ ! -d "$SDK_ROOT" ]; then
            echo "ERROR: Android SDK directory does not exist: $SDK_ROOT"
            exit 1
          fi
          echo "sdk.dir=$SDK_ROOT" > local.properties

      - name: Print build tool versions
        script: |
          set -e
          cd "$CM_BUILD_DIR"
          xcodebuild -version
          java -version
          ./gradlew --version

      - name: Build Kotlin/Native iPhone framework
        script: |
          set -e
          set -o pipefail
          cd "$CM_BUILD_DIR"
          mkdir -p "$CM_BUILD_DIR/build"
          ./gradlew :shared:linkDebugFrameworkIosArm64 --stacktrace --info \
            2>&1 | tee "$CM_BUILD_DIR/build/kotlin-ios-device-framework.log"

      - name: Build unsigned iPhone app
        script: |
          set -e
          set -o pipefail
          mkdir -p "$CM_BUILD_DIR/build"
          WORDCLOCK_SKIP_GRADLE_FRAMEWORK_BUILD=1 xcodebuild build \
            -project "$CM_BUILD_DIR/iosApp/WordClock.xcodeproj" \
            -target WordClockIOS \
            -sdk iphoneos \
            -configuration Debug \
            SYMROOT="$CM_BUILD_DIR/build/ios-device/Build/Products" \
            OBJROOT="$CM_BUILD_DIR/build/ios-device/Build/Intermediates.noindex" \
            ARCHS=arm64 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            2>&1 | tee "$CM_BUILD_DIR/build/ios-device-build.log"

      - name: Package unsigned IPA
        script: |
          set -e
          APP_PATH="$CM_BUILD_DIR/build/ios-device/Build/Products/Debug-iphoneos/WordClockIOS.app"
          PACKAGE_DIR="$CM_BUILD_DIR/build/unsigned-ipa"
          if [ ! -d "$APP_PATH" ]; then
            echo "ERROR: iPhone app not found at $APP_PATH"
            exit 1
          fi
          mkdir -p "$PACKAGE_DIR/Payload"
          ditto "$APP_PATH" "$PACKAGE_DIR/Payload/WordClockIOS.app"
          cd "$PACKAGE_DIR"
          /usr/bin/zip -qry "$CM_BUILD_DIR/build/WordClock-unsigned.ipa" Payload

    artifacts:
      - build/WordClock-unsigned.ipa
      - build/ios-device-build.log
      - build/kotlin-ios-device-framework.log
