
workflows:
  ios-simulator:
    name: WordClock - iOS Simulator
    max_build_duration: 120
    instance_type: mac_mini_m2

    environment:
      xcode: 26.6

    cache:
      cache_paths:
        - $HOME/.gradle/caches
        - $HOME/.gradle/wrapper
        - $HOME/.konan

    scripts:
      - name: Configure Android SDK for Gradle
        script: |
          set -e
          chmod +x "$CM_BUILD_DIR/gradlew"

          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/share/android-sdk}}"
          echo "sdk.dir=$SDK_ROOT" > "$CM_BUILD_DIR/local.properties"

          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager || true)"
          fi

          if [ ! -x "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager was not found."
            exit 1
          fi

          if [ ! -d "$SDK_ROOT/platforms/android-37" ]; then
            yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platforms;android-37"
          fi

      - name: Print build tool versions
        script: |
          xcodebuild -version
          java -version

      - name: Build WordClock for iOS Simulator
        script: |
          set -o pipefail
          mkdir -p "$CM_BUILD_DIR/build"

          xcodebuild build \
            -project "$CM_BUILD_DIR/iosApp/WordClock.xcodeproj" \
            -scheme WordClock \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            -derivedDataPath "$CM_BUILD_DIR/build/ios-simulator" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            2>&1 | tee "$CM_BUILD_DIR/build/ios-simulator-build.log"

    artifacts:
      - build/ios-simulator/Build/Products/Debug-iphonesimulator/WordClock.app
      - build/ios-simulator-build.log

  ios-release:
    name: WordClock - iOS IPA (App Store)
    max_build_duration: 120
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: WordClockAppStore

    environment:
      xcode: 26.6

      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.ghazarian.wordclock.ios

    cache:
      cache_paths:
        - $HOME/.gradle/caches
        - $HOME/.gradle/wrapper
        - $HOME/.konan

    scripts:
      - name: Configure Android SDK for Gradle
        script: |
          set -e
          chmod +x "$CM_BUILD_DIR/gradlew"

          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/share/android-sdk}}"
          echo "sdk.dir=$SDK_ROOT" > "$CM_BUILD_DIR/local.properties"

          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager || true)"
          fi

          if [ ! -x "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager was not found."
            exit 1
          fi

          if [ ! -d "$SDK_ROOT/platforms/android-37" ]; then
            yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platforms;android-37"
          fi

      - name: Configure iOS code signing
        script: |
          xcode-project use-profiles

      - name: Build signed IPA
        script: |
          xcode-project build-ipa \
            --project "$CM_BUILD_DIR/iosApp/WordClock.xcodeproj" \
            --scheme WordClock

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
