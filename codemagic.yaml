workflows:
  ios-simulator:
    name: WordClock - iOS Simulator
    max_build_duration: 120
    instance_type: mac_mini_m2

    environment:
      xcode: latest

    cache:
      cache_paths:
        - $HOME/.gradle/caches
        - $HOME/.gradle/wrapper
        - $HOME/.konan

    scripts:
      - name: Configure Gradle and Android SDK path
        script: |
          set -e
          cd "$CM_BUILD_DIR"
          chmod +x ./gradlew

          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/share/android-sdk}}"
          if [ ! -d "$SDK_ROOT" ]; then
            echo "ERROR: Android SDK directory does not exist: $SDK_ROOT"
            exit 1
          fi

          echo "sdk.dir=$SDK_ROOT" > local.properties
          echo "Android SDK path: $SDK_ROOT"

      - name: Print build tool versions
        script: |
          set -e
          cd "$CM_BUILD_DIR"
          xcodebuild -version
          java -version
          ./gradlew --version

      - name: Build WordClock for iOS Simulator
        script: |
          set -e
          set -o pipefail
          mkdir -p "$CM_BUILD_DIR/build"

          xcodebuild build \
            -project "$CM_BUILD_DIR/iosApp/WordClock.xcodeproj" \
            -scheme WordClock \
            -sdk iphonesimulator \
            -destination "generic/platform=iOS Simulator" \
            -configuration Debug \
            -derivedDataPath "$CM_BUILD_DIR/build/ios-simulator" \
            ARCHS=arm64 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            2>&1 | tee "$CM_BUILD_DIR/build/ios-simulator-build.log"

      - name: Package simulator app
        script: |
          set -e
          APP_PATH="$CM_BUILD_DIR/build/ios-simulator/Build/Products/Debug-iphonesimulator/WordClock.app"

          if [ ! -d "$APP_PATH" ]; then
            echo "ERROR: Simulator app not found at $APP_PATH"
            exit 1
          fi

          ditto -c -k --sequesterRsrc --keepParent \
            "$APP_PATH" \
            "$CM_BUILD_DIR/build/WordClock-iOS-Simulator.zip"

    artifacts:
      - build/WordClock-iOS-Simulator.zip
      - build/ios-simulator-build.log

  ios-release:
    name: WordClock - iOS IPA (App Store)
    max_build_duration: 120
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: WordClockAppStore

    environment:
      xcode: latest
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.ghazarian.wordclock.ios

    cache:
      cache_paths:
        - $HOME/.gradle/caches
        - $HOME/.gradle/wrapper
        - $HOME/.konan

    scripts:
      - name: Configure Gradle and Android SDK path
        script: |
          set -e
          cd "$CM_BUILD_DIR"
          chmod +x ./gradlew

          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/share/android-sdk}}"
          if [ ! -d "$SDK_ROOT" ]; then
            echo "ERROR: Android SDK directory does not exist: $SDK_ROOT"
            exit 1
          fi

          echo "sdk.dir=$SDK_ROOT" > local.properties
          echo "Android SDK path: $SDK_ROOT"

      - name: Print build tool versions
        script: |
          set -e
          cd "$CM_BUILD_DIR"
          xcodebuild -version
          java -version
          ./gradlew --version

      - name: Configure iOS code signing
        script: |
          set -e
          xcode-project use-profiles \
            --project "$CM_BUILD_DIR/iosApp/WordClock.xcodeproj"

      - name: Build signed IPA
        script: |
          set -e
          xcode-project build-ipa \
            --project "$CM_BUILD_DIR/iosApp/WordClock.xcodeproj" \
            --scheme WordClock

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
